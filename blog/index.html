<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #b0612e; }
    ::selection { background: var(--accent); color: #faf8f3; }

    .blog-hero { padding-top: 88px; padding-bottom: 48px; }
    .blog-hero-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 48px; flex-wrap: wrap; }
    .blog-overline { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
    .blog-overline i { width: 28px; height: 1px; background: var(--accent); display: inline-block; }
    .blog-hero h1 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(52px, 8vw, 88px); line-height: 0.92; font-weight: 600; letter-spacing: -0.03em; color: #1c1a15; }
    .blog-lede { margin: 30px 0 0; font-size: 19px; line-height: 1.55; color: #6b665a; max-width: 460px; }
    .blog-count { text-align: right; padding-bottom: 10px; }
    .blog-count .n { font-family: 'JetBrains Mono', monospace; font-size: 34px; font-weight: 500; color: #1c1a15; line-height: 1; }
    .blog-count .l { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9486; margin-top: 8px; }

    .blog-label { display: flex; align-items: center; justify-content: space-between; padding-bottom: 14px; border-bottom: 1px solid #ddd8cb; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #9a9486; }
    .blog-label b { color: #23211c; font-weight: 400; }

    .blog-post { text-decoration: none; color: inherit; display: grid; grid-template-columns: 160px 1fr 130px; gap: 32px; align-items: start; padding: 30px 0 44px; border-bottom: 1px solid #e3dece; transition: background 0.15s; }
    .blog-post:last-child { border-bottom: none; }
    .blog-post:hover { background: #efece2; border-radius: 3px; padding-left: 12px; padding-right: 12px; margin-left: -12px; margin-right: -12px; }
    .blog-post .meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #8c8678; line-height: 1.9; }
    .blog-post .meta .idx { color: #b3ad9e; margin-top: 4px; }
    .blog-post h2 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 23px; line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; color: #1c1a15; max-width: 760px; text-wrap: balance; transition: color 0.15s; }
    .blog-post:hover h2 { color: var(--accent); }
    .blog-post .read { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
    .blog-post .tag { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b665a; border: 1px solid #d8d2c3; border-radius: 999px; padding: 5px 12px; }
    .blog-post .cat { text-align: right; }

    .blog-section { padding-bottom: 48px; }

    @media (max-width: 640px) {
      .blog-post { grid-template-columns: 1fr; gap: 12px; }
      .blog-post .cat { text-align: left; }
      .blog-post .meta .idx { display: none; }
    }
  </style>
</head>
<body data-title="Blog">

  <nav id="site-nav"></nav>

  <main class="page-content">
    <div class="container">

      <section class="blog-hero">
        <div class="blog-hero-row">
          <div style="max-width: 680px;">
            <div class="blog-overline"><i></i>Writing — Notes &amp; Field Logs</div>
            <h1>Blog</h1>
            <p class="blog-lede">Notes on engineering, travel, and the things worth writing down.</p>
          </div>
          <div class="blog-count">
            <div class="n">02</div>
            <div class="l">Essays Published</div>
          </div>
        </div>
      </section>

      <!-- ====================================================
        HOW TO ADD A POST:

        1. Copy one <a class="blog-post"> block below.
        2. Paste it right after the .blog-label div (newest first).
        3. Update: href, meta date, meta index number, h2 title, tag.
        4. Bump the count number in .blog-count .n above.
        5. Create the post file (copy template-post.html).
      ==================================================== -->

      <section class="blog-section">
        <div class="blog-label"><b>Latest</b><span>2025</span></div>

        <a class="blog-post" href="why_supersonic_flight_failed.html">
          <div class="meta">
            <div>May 2025</div>
            <div class="idx">Essay 02</div>
          </div>
          <div>
            <h2>Why Supersonic Flight Failed — and What It Will Take to Succeed</h2>
            <span class="read">Read essay ↗</span>
          </div>
          <div class="cat"><span class="tag">Aerospace</span></div>
        </a>

        <!-- ADD NEW POSTS ABOVE THIS LINE -->

      </section>

    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../js/config.js"></script>
  <script src="../js/components.js"></script>
</body>
</html>
